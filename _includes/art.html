{% comment %} Every hand-drawn piece the script can clone. A file swapped in
   under the same name needs nothing else; a new variant needs its own line
   here, and its name must start with loop-, scribble- or doodle-. {% endcomment %}
<template data-art="loop-1">{% include loops/loop-1.svg %}</template>
<template data-art="loop-2">{% include loops/loop-2.svg %}</template>
<template data-art="loop-3">{% include loops/loop-3.svg %}</template>
<template data-art="scribble-1">{% include scribbles/scribble-1.svg %}</template>
<template data-art="scribble-2">{% include scribbles/scribble-2.svg %}</template>
<template data-art="scribble-3">{% include scribbles/scribble-3.svg %}</template>
<template data-art="doodle-glass">{% include doodles/glass.svg %}</template>
<template data-art="doodle-bottle">{% include doodles/bottle.svg %}</template>
<template data-art="doodle-grapes">{% include doodles/grapes.svg %}</template>
<template data-art="doodle-crisps">{% include doodles/crisps.svg %}</template>
<template data-art="doodle-star">{% include doodles/star.svg %}</template>
<template data-art="doodle-swirl">{% include doodles/swirl.svg %}</template>
<template data-art="doodle-arrow">{% include doodles/arrow.svg %}</template>
<template data-art="underline">{% include doodles/underline.svg %}</template>
