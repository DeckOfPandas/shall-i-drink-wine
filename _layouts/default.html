<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
{% include brick-wall.svg %}
<div class="page">
  <div class="frame">
    <main class="board" id="board">
      <svg class="smudge" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M-10 30 L 110 4 M-10 92 L 110 62"/></svg>
      <div class="stage" id="stage">
        {{ content }}
      </div>
      <div class="doodles" id="doodles" aria-hidden="true"></div>
    </main>
  </div>
  <footer class="site-footer">
    <a class="footer-github" href="https://github.com/DeckOfPandas/shall-i-drink-wine" aria-label="Source on GitHub">{% include icons/github.svg %}</a>
    <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
    <div class="hearts" aria-hidden="true">{% include icons/hearts.svg %}</div>
  </footer>
</div>
<div class="visually-hidden" id="announce" aria-live="polite"></div>
{% include art.html %}
</body>
</html>
